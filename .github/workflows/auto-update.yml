name: 24/7 Automated Govt Jobs & Results Sync

on:
  schedule:
    # Runs automatically every 30 minutes, 24/7/365 in GitHub Cloud
    # (free unlimited minutes — repo is public)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub
    inputs:
      telegram_test:
        description: 'Also send a TEST message to the Telegram channel?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Prevent overlapping runs if a previous cycle is still executing
concurrency:
  group: live-agent-sync
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git Identity (before agent, so its internal auto-commit works)
        run: |
          git config --global user.name "Sarkari Sahayak Bot"
          git config --global user.email "bot@salarypitcher.com"

      - name: Run 24/7 Live Ingestion Agent (+ Telegram Channel Auto-Post)
        env:
          # Set these in: Repo → Settings → Secrets and variables → Actions
          # If unset, the agent still syncs normally — Telegram step just skips safely.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node src/scripts/live-agent.mjs

      - name: Optional — Send Telegram TEST message (manual trigger only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/scripts/telegram-notify.mjs --test

      - name: Check for Changes and Auto-Commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add src/data/ public/sitemap.xml
            git commit -m "🤖 auto-sync: latest govt jobs, results & admit cards [skip ci]"
            git push origin main
            echo "✓ New updates pushed to repository. Auto-deploy triggered!"
          else
            echo "✓ Datasets are up-to-date. No new entries found."
          fi
